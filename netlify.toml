[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/slots"
  to = "/.netlify/functions/slots"
  status = 200

[[redirects]]
  from = "/api/move"
  to = "/.netlify/functions/move"
  status = 200

[[redirects]]
  from = "/api/print"
  to = "/.netlify/functions/printdoc"
  status = 200

[[redirects]]
  from = "/api/agent"
  to = "/.netlify/functions/agent-chat"
  status = 200

[[redirects]]
  from = "/api/queue"
  to = "/.netlify/functions/queue-order"
  status = 200
